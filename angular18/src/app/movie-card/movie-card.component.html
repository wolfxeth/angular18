<div class="movie-card" (click)="onCardClick()" (keydown.enter)="onCardClick()">
  <div class="poster-wrap">
    <img [src]="movie().poster" alt="Movie Poster" class="movie-poster" (error)="setDefaultPoster($event)">
    <div class="poster-overlay">
      <span class="view-btn">
        <span class="material-icons-round">visibility</span> View details
      </span>
    </div>
    @if (movie().imdb?.rating) {
      <span class="rating-badge">
        <span class="material-icons-round">star</span>{{ movie().imdb!.rating }}
      </span>
    }
  </div>
  <div class="movie-info">
    <h2>{{ movie().title }}</h2>
    <p class="movie-meta">{{ movie().year }} &bull; {{ movie().runtime }} min</p>
  </div>
</div>
